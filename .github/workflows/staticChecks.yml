name: Static checks

on: [pull_request, push]

jobs:
  ci-static-checks:
    runs-on: ubuntu-latest
    env:
      # Prettier cannot resolve prettier-plugin-organize-imports under Yarn's default PnP linker
      YARN_NODE_LINKER: node-modules
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
      - name: Install dependencies
        run: npm ci
      - name: Build code
        run: npm run build
      - name: Run linters
        run: npm run lint
      - name: Run unit tests
        run: npm run test
